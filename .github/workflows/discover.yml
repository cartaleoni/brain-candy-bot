name: Brain Candy Weekly Discovery

on:
  schedule:
    # Run every Sunday at 10 AM Chicago time (4 PM UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
    contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore state from bot-state branch
        run: |
          if git ls-remote --heads origin bot-state | grep -q bot-state; then
            echo "Fetching state from bot-state branch..."
            git fetch origin bot-state

            for f in posted.json queue.json daily_sources.json pending_review.json approved.json rejected_sources.json training_log.json discovered_sources.json pending_discovery_review.json feed_health.json; do
              git show origin/bot-state:"$f" > "$f" 2>/dev/null && echo "Restored $f" || true
            done
          else
            echo "WARNING: bot-state branch not found — no state to restore"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python discover.py --weekly

      - name: Send weekly stats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py --stats

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save feeds.py changes to main branch
          if ! git diff --quiet feeds.py 2>/dev/null; then
            git add feeds.py
            git commit -m "Weekly discovery: add new sources [skip ci]"
            git push origin main || true
          fi

          # Save state files to bot-state branch
          mkdir -p /tmp/bot-state
          for f in posted.json queue.json daily_sources.json pending_review.json approved.json rejected_sources.json training_log.json discovered_sources.json pending_discovery_review.json feed_health.json; do
            [ -f "$f" ] && cp "$f" /tmp/bot-state/
          done

          if git ls-remote --heads origin bot-state | grep -q bot-state; then
            git fetch origin bot-state
            git checkout -f origin/bot-state -B bot-state
          else
            git checkout --orphan bot-state
            git rm -rf . 2>/dev/null || true
          fi

          for f in posted.json queue.json daily_sources.json pending_review.json approved.json rejected_sources.json training_log.json discovered_sources.json pending_discovery_review.json feed_health.json; do
            [ -f "/tmp/bot-state/$f" ] && cp "/tmp/bot-state/$f" "$f"
          done

          git add *.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "Update bot state [skip ci]"

          for i in 1 2 3; do
            if git push origin bot-state; then
              echo "State saved to bot-state branch"
              exit 0
            fi
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase origin bot-state
          done

          echo "ERROR: Failed to save state after 3 attempts"
          exit 1
