name: Brain Candy Scheduled Post

on:
    schedule:
      - cron: '0 16,17 * * 1-5'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: brain-candy-post
    cancel-in-progress: false

jobs:
    post:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0

        - name: Restore latest state files
          run: |
            # State files may be stale if a code push overwrote GHA's state commits.
            # Recover the latest version of each state file from git history.
            STATE_FILES="posted.json queue.json daily_sources.json pending_review.json approved.json rejected_sources.json training_log.json discovered_sources.json pending_discovery_review.json feed_health.json"
            for f in $STATE_FILES; do
              LATEST_COMMIT=$(git log --all -1 --format="%H" -- "$f")
              if [ -n "$LATEST_COMMIT" ]; then
                git show "$LATEST_COMMIT:$f" > "$f" 2>/dev/null && echo "Restored $f from $LATEST_COMMIT" || true
              fi
            done

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run bot
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHANNEL_ID: "@candyforthebrain"
          run: python main.py --github-actions

        - name: Save state
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Only commit state files — never source code
            STATE_FILES="posted.json queue.json daily_sources.json pending_review.json approved.json rejected_sources.json training_log.json discovered_sources.json pending_discovery_review.json feed_health.json"

            for f in $STATE_FILES; do
              [ -f "$f" ] && git add -f "$f"
            done

            if git diff --staged --quiet; then
              echo "No state changes to commit"
              exit 0
            fi

            git commit -m "Update bot state [skip ci]"

            # Retry push up to 3 times with pull-rebase in between
            for i in 1 2 3; do
              if git push; then
                echo "State saved successfully"
                exit 0
              fi
              echo "Push attempt $i failed, pulling and retrying..."
              git pull --rebase origin main
            done

            echo "ERROR: Failed to save state after 3 attempts"
            exit 1
